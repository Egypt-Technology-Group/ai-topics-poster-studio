<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>AI Topics — Poster Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900;1000&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<a href="#main-content" class="skip-link">تخطي إلى المعاينة</a>
<header class="topbar" role="banner" aria-label="شريط أدوات AI Topics">
  <div class="brand"><div class="dot"></div>AI Topics <span class="brand-sub">Poster Editor</span></div>
  <button type="button" class="tbtn sidebar-toggle" id="sidebarToggle" aria-label="إظهار/إخفاء لوحة التحكم" aria-expanded="false" aria-controls="sidebar">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    <span>اللوحة</span>
  </button>
  <div class="spacer" aria-hidden="true"></div>
  <button type="button" class="tbtn" id="btnUndo" title="تراجع (Ctrl+Z)">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    <span>تراجع</span>
  </button>
  <button type="button" class="tbtn" id="btnRedo" title="إعادة (Ctrl+Y)">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
    <span>إعادة</span>
  </button>
  <button type="button" class="tbtn" id="btnNew" title="مشروع جديد">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
    <span>جديد</span>
  </button>
  <button type="button" class="tbtn" id="btnSave" title="حفظ المشروع (JSON)">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    <span>حفظ JSON</span>
  </button>
  <button type="button" class="tbtn" id="btnLoad" title="تحميل مشروع (JSON)">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span>تحميل JSON</span>
  </button>
  <button type="button" class="tbtn primary" id="btnExport" title="تصدير صورة PNG">
    <svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>تصدير PNG</span>
  </button>
  <input type="file" id="fileLoad" accept=".json" style="display:none" aria-hidden="true" tabindex="-1">
</header>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="لوحة التحكم"></aside>

  <main class="preview-wrap" id="main-content" aria-label="معاينة البوستر">
    <div class="pv-ctrl">
      <label for="zoom" class="zl">تكبير</label>
      <input type="range" id="zoom" min="25" max="100" value="55">
      <span class="zl" id="zoomVal" aria-live="polite" aria-atomic="true">55%</span>
      <div style="flex:1" aria-hidden="true"></div>
      <span class="zl" id="dimInfo">900px</span>
    </div>
    <div class="poster-stage" id="stage"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
// Sidebar toggle for small screens
(function(){
  var btn = document.getElementById('sidebarToggle');
  var sb = document.getElementById('sidebar');
  if(!btn || !sb) return;
  btn.addEventListener('click', function(){
    var open = sb.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  // Close sidebar when clicking outside on small screens
  document.addEventListener('click', function(e){
    if(window.innerWidth > 1024) return;
    if(!sb.classList.contains('open')) return;
    if(sb.contains(e.target) || btn.contains(e.target)) return;
    sb.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
